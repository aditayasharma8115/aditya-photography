<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Aditya Photography</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar"><a class="brand" href="index.html">Aditya <span>Photography</span></a><nav><a href="index.html">Home</a></nav></header>
<main class="admin">
<section class="panel" id="loginPanel">
<h1>Admin Login</h1><p class="muted">Only the site owner can upload photos.</p>
<form id="loginForm"><input id="username" placeholder="Username" required><input id="password" type="password" placeholder="Password" required><button>Login</button></form>
<p class="hint">Demo login: <b>aditya</b> / <b>change-me</b>. Change this before publishing.</p>
</section>

<section class="panel hidden" id="uploadPanel">
<div class="section-head"><div><h1>Upload Photo</h1><p class="muted">Your browser stores demo photos locally.</p></div><button id="logout" class="secondary">Logout</button></div>
<form id="uploadForm">
<label>Photo<input id="file" type="file" accept="image/*" required></label>
<label>Title<input id="title" maxlength="120" placeholder="Photo title" required></label>
<label>Caption<textarea id="caption" maxlength="500" placeholder="Write a short caption"></textarea></label>
<label>Tags<input id="tags" placeholder="nature, travel, portrait"></label>
<button>Publish Photo</button>
</form>
<div id="adminList"></div>
</section>
</main>
<footer>© <span id="year"></span> Aditya Photography</footer>
<script src="app.js"></script>
</body>
</html>
